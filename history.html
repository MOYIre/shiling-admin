<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核记录 - 食灵</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      padding: 16px;
    }
    #app { max-width: 600px; margin: 0 auto; }
    
    h1 { font-size: 20px; margin-bottom: 16px; text-align: center; }
    
    /* 管理员提示 */
    .admin-hint {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }
    .admin-hint.admin { color: #27ae60; }
    
    /* 过滤器 */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filters input, .filters select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      font-size: 14px;
      background: #fff;
    }
    .filters input { flex: 1; min-width: 120px; }
    .filters select { min-width: 100px; }
    
    /* 状态标签 */
    .status-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    .status-tab {
      padding: 10px 16px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .status-tab:hover { color: #333; }
    .status-tab.active { color: #333; border-bottom-color: #333; }
    .status-tab .count {
      display: inline-block;
      min-width: 16px;
      height: 16px;
      margin-left: 4px;
      padding: 0 4px;
      background: #e0e0e0;
      color: #666;
      font-size: 10px;
      line-height: 16px;
      text-align: center;
      border-radius: 8px;
    }
    
    /* 批量操作栏 */
    .batch-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      margin-bottom: 12px;
    }
    .batch-bar.show { display: flex; }
    .batch-bar .selected-count { font-size: 13px; color: #666; }
    .batch-bar .btn-group { margin-left: auto; display: flex; gap: 8px; }
    
    /* 按钮 */
    .btn {
      padding: 8px 14px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #f5f5f5; }
    .btn.danger { background: #e74c3c; color: #fff; border-color: #e74c3c; }
    .btn.danger:hover { background: #c0392b; }
    .btn.small { padding: 4px 8px; font-size: 12px; }
    .btn.primary { background: #333; color: #fff; border-color: #333; }
    
    /* 记录列表 */
    .record-list { display: flex; flex-direction: column; gap: 8px; }
    .record-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-left: 3px solid #999;
      transition: all 0.2s;
    }
    .record-item.selected { background: #f0f7ff; border-color: #3498db; }
    .record-item.approved { border-left-color: #27ae60; }
    .record-item.rejected { border-left-color: #e74c3c; }
    .record-item.pending { border-left-color: #f39c12; }
    .record-item.deleting { opacity: 0.5; pointer-events: none; }
    
    /* 复选框 */
    .record-checkbox {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
    }
    .record-checkbox.hidden { display: none; }
    
    .record-content { flex: 1; min-width: 0; }
    
    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .record-status {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .record-status.approved { background: #d4edda; color: #155724; }
    .record-status.rejected { background: #f8d7da; color: #721c24; }
    .record-status.pending { background: #fff3cd; color: #856404; }
    
    .record-name { font-size: 15px; font-weight: 500; margin: 4px 0; }
    .record-meta { font-size: 12px; color: #888; }
    .record-meta span { margin-right: 12px; }
    
    .record-qq {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .record-qq img { width: 16px; height: 16px; border-radius: 50%; }
    
    /* 单条删除按钮 */
    .delete-single {
      opacity: 0;
      padding: 4px 8px;
      font-size: 12px;
      background: #fff;
      border: 1px solid #e74c3c;
      color: #e74c3c;
      cursor: pointer;
      white-space: nowrap;
    }
    .record-item:hover .delete-single { opacity: 1; }
    .delete-single:hover { background: #e74c3c; color: #fff; }
    .delete-single.hidden { display: none; }
    
    .empty { text-align: center; color: #888; padding: 32px; font-size: 14px; }

    /* 分页 */
    .pagination {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: #666;
    }
    .pagination.show { display: flex; }
    .pagination .page-info { min-width: 120px; text-align: center; }
    .pagination .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #f5f5f5;
    }

    /* 加载 */
    .loading { text-align: center; padding: 32px; color: #888; }
    
    /* 底部链接 */
    .footer-link {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }
    .footer-link a { color: #333; font-size: 13px; }
    
    /* 响应式 */
    @media (max-width: 400px) {
      .filters { flex-direction: column; }
      .filters input, .filters select { width: 100%; }
      .batch-bar { flex-wrap: wrap; }
      .batch-bar .btn-group { margin-left: 0; width: 100%; justify-content: flex-end; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>审核记录</h1>
    
    <div id="admin-hint" class="admin-hint"></div>
    
    <!-- 状态标签 -->
    <div class="status-tabs">
      <button class="status-tab active" data-status="">全部</button>
      <button class="status-tab" data-status="approved">已通过</button>
      <button class="status-tab" data-status="pending">待审核</button>
      <button class="status-tab" data-status="rejected">未通过</button>
    </div>
    
    <!-- 批量操作栏 -->
    <div id="batch-bar" class="batch-bar">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
        <input type="checkbox" id="select-all"> 全选
      </label>
      <span class="selected-count">已选 <span id="selected-count">0</span> 项</span>
      <div class="btn-group">
        <button class="btn danger" id="batch-delete-btn">删除选中</button>
      </div>
    </div>
    
    <!-- 过滤器 -->
    <div class="filters">
      <input type="text" id="search-keyword" placeholder="搜索菜品/饮品名...">
      <input type="text" id="search-qq" placeholder="QQ号">
    </div>
    
    <!-- 记录列表 -->
    <div id="record-list" class="record-list">
      <div class="loading">加载中...</div>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="pagination">
      <button class="btn small" id="prev-page">上一页</button>
      <span class="page-info" id="page-info"></span>
      <button class="btn small" id="next-page">下一页</button>
    </div>

    <div class="footer-link">
      <a href="/">返回管理面板</a>
      <p style="margin-top: 12px; font-size: 13px; color: #666;">
        招募菜单管理员<br>
        报名请加QQ: 3029590078
      </p>
    </div>
  </div>

  <script>
    const HISTORY_API = '/api/history';
    const PENDING_API = '/api/pending';
    let allRecords = [];
    let currentStatus = '';
    let currentPage = 1;
    const pageSize = 20;
    let selectedIndexes = new Set();
    let isAdmin = false;
    let authToken = null;
    
    const $ = id => document.getElementById(id);
    
    const periodNames = {
      breakfast: '早餐', lunch: '午餐', dinner: '晚餐', midnight: '夜宵',
      extra: '通用池', all: '不限时段'
    };
    
    const statusTexts = {
      approved: '已通过',
      rejected: '未通过',
      pending: '待审核'
    };
    
    // 检查管理员登录状态
    function checkAdmin() {
      const loginType = sessionStorage.getItem('login_type');
      
      // 只有 GitHub 登录才是超级管理员，才能删除记录
      if (loginType === 'github') {
        authToken = sessionStorage.getItem('gh_token');
        isAdmin = true;
      } else {
        isAdmin = false;
      }
      
      const hint = $('admin-hint');
      if (isAdmin) {
        hint.className = 'admin-hint admin';
        hint.textContent = '✓ 超级管理员模式 - 可删除记录';
        $('batch-bar').classList.add('show');
      } else {
        hint.style.display = 'none';
      }
    }
    
    async function fetchHistory() {
      try {
        const qq = $('search-qq').value.trim();
        const keyword = $('search-keyword').value.trim();
        
        let url = HISTORY_API + '?';
        if (qq) url += 'qq=' + encodeURIComponent(qq) + '&';
        if (keyword) url += 'keyword=' + encodeURIComponent(keyword) + '&';
        if (currentStatus) url += 'status=' + currentStatus;
        
        const res = await fetch(url);
        allRecords = await res.json();
        currentPage = 1;
        selectedIndexes.clear();
        updateBatchBar();
        renderRecords();
      } catch (e) {
        $('record-list').innerHTML = '<p class="empty">加载失败</p>';
      }
    }
    
    function renderRecords() {
      const container = $('record-list');
      const totalPages = Math.ceil(allRecords.length / pageSize);

      if (allRecords.length === 0) {
        container.innerHTML = '<p class="empty">暂无记录</p>';
        renderPagination(totalPages);
        return;
      }

      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * pageSize;
      const pageRecords = allRecords.slice(startIndex, startIndex + pageSize);

      container.innerHTML = pageRecords.map((record, pageIdx) => {
        const idx = startIndex + pageIdx;
        return `
        <div class="record-item ${record.status} ${selectedIndexes.has(idx) ? 'selected' : ''}" data-idx="${idx}">
          <input type="checkbox" class="record-checkbox ${isAdmin ? '' : 'hidden'}"
                 data-idx="${idx}" ${selectedIndexes.has(idx) ? 'checked' : ''}>
          <div class="record-content">
            <div class="record-header">
              <span class="record-meta">${record.action || '加菜'}</span>
              <span class="record-status ${record.status}">${statusTexts[record.status]}</span>
            </div>
            <div class="record-name">${record.name}</div>
            <div class="record-meta">
              <span>${record.type === 'food' ? '菜品' : '饮品'} - ${periodNames[record.period] || record.period}</span>
              ${record.qq ? `<span class="record-qq"><img src="https://q1.qlogo.cn/g?b=qq&nk=${record.qq}&s=40" alt=""> ${record.qq}</span>` : ''}
              <span>${new Date(record.time).toLocaleString('zh-CN')}</span>
            </div>
          </div>
          <button class="delete-single ${isAdmin ? '' : 'hidden'}" data-idx="${idx}">删除</button>
        </div>
      `;
      }).join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pagination = $('pagination');

      if (totalPages <= 1) {
        pagination.classList.remove('show');
        return;
      }

      pagination.classList.add('show');
      $('page-info').textContent = `第 ${currentPage} / ${totalPages} 页，共 ${allRecords.length} 条`;
      $('prev-page').disabled = currentPage === 1;
      $('next-page').disabled = currentPage === totalPages;
    }

    function updateBatchBar() {
      $('selected-count').textContent = selectedIndexes.size;
      $('select-all').checked = selectedIndexes.size === allRecords.length && allRecords.length > 0;
    }
    
    // 删除记录
    async function deleteRecords(indexes) {
      if (!isAdmin || indexes.length === 0) return;
      
      if (!confirm(`确定要删除 ${indexes.length} 条记录吗？`)) return;
      
      // 传递记录的关键字段用于匹配
      const records = indexes.map(idx => {
        const r = allRecords[idx];
        return { time: r.time, status: r.status, name: r.name };
      });
      
      try {
        const res = await fetch(HISTORY_API, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ records })
        });
        
        const result = await res.json();
        if (result.success) {
          // 从UI移除已删除的记录
          indexes.sort((a, b) => b - a).forEach(idx => {
            allRecords.splice(idx, 1);
          });
          selectedIndexes.clear();
          updateBatchBar();
          renderRecords();
        } else {
          alert(result.error || '删除失败');
        }
      } catch (e) {
        alert('删除失败: ' + e.message);
      }
    }
    
    // 状态标签切换
    document.querySelectorAll('.status-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentStatus = tab.dataset.status;
        fetchHistory();
      });
    });
    
    // 搜索防抖
    let searchTimer;
    function debounceSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(fetchHistory, 300);
    }
    
    $('search-keyword').addEventListener('input', debounceSearch);
    $('search-qq').addEventListener('input', debounceSearch);
    
    // 复选框事件
    $('record-list').addEventListener('change', e => {
      if (e.target.classList.contains('record-checkbox')) {
        const idx = parseInt(e.target.dataset.idx);
        if (e.target.checked) {
          selectedIndexes.add(idx);
        } else {
          selectedIndexes.delete(idx);
        }
        updateBatchBar();
        // 更新行样式
        const item = e.target.closest('.record-item');
        item.classList.toggle('selected', e.target.checked);
      }
    });
    
    // 全选
    $('select-all').addEventListener('change', e => {
      if (e.target.checked) {
        allRecords.forEach((_, idx) => selectedIndexes.add(idx));
      } else {
        selectedIndexes.clear();
      }
      updateBatchBar();
      renderRecords();
    });
    
    // 单条删除
    $('record-list').addEventListener('click', e => {
      if (e.target.classList.contains('delete-single')) {
        const idx = parseInt(e.target.dataset.idx);
        deleteRecords([idx]);
      }
    });
    
    // 批量删除
    $('batch-delete-btn').addEventListener('click', () => {
      deleteRecords([...selectedIndexes]);
    });

    // 分页
    $('prev-page').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderRecords();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    $('next-page').addEventListener('click', () => {
      const totalPages = Math.ceil(allRecords.length / pageSize);
      if (currentPage < totalPages) {
        currentPage++;
        renderRecords();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // 初始化
    checkAdmin();
    fetchHistory();
  </script>
</body>
</html>
