<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食灵管理面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 登录前 -->
    <div id="login-screen" class="screen">
      <div class="container">
        <h1>食灵管理面板</h1>
        <p class="subtitle">云菜单管理系统</p>

        <!-- 统一登录 -->
        <div class="login-options">
          <div class="login-option">
            <h3>管理员登录</h3>
            <p class="desc">向骰子发送 <code>.食灵 登录</code> 获取Token</p>
            <div class="token-form">
              <input type="text" id="token-input" placeholder="输入登录Token（支持骰子/GitHub）...">
              <button class="btn primary" id="login-btn">登录</button>
            </div>
          </div>
        </div>

        <p class="hint">管理员通过骰子获取Token，超级管理员可使用GitHub Token</p>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="main-screen" class="screen hidden">
      <header>
        <h1>食灵管理面板</h1>
        <div class="user-info">
          <img id="avatar" src="" alt="avatar">
          <span id="username"></span>
          <span id="role-badge" class="badge"></span>
          <button id="logout-btn" class="btn small">退出</button>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="menu">菜单管理</button>
        <button class="tab" data-tab="drink">饮品单</button>
        <button class="tab" data-tab="pending">待审核 <span id="pending-count" class="count hidden">0</span></button>
        <button class="tab admin-only hidden" data-tab="admins">管理员</button>
      </nav>

      <main>
        <!-- 菜单管理 -->
        <section id="menu-tab" class="tab-content active">
          <div class="period-tabs">
            <button class="period-tab active" data-period="breakfast">早餐</button>
            <button class="period-tab" data-period="lunch">午餐</button>
            <button class="period-tab" data-period="dinner">晚餐</button>
            <button class="period-tab" data-period="midnight">夜宵</button>
            <button class="period-tab" data-period="extra">通用池</button>
          </div>
          <div class="menu-list" id="food-list"></div>
          <div class="add-form">
            <input type="text" id="new-food" placeholder="添加新菜品...">
            <button class="btn" id="add-food-btn">添加</button>
          </div>
        </section>

        <!-- 饮品单 -->
        <section id="drink-tab" class="tab-content hidden">
          <div class="menu-list" id="drink-list"></div>
          <div class="add-form">
            <input type="text" id="new-drink" placeholder="添加新饮品...">
            <button class="btn" id="add-drink-btn">添加</button>
          </div>
        </section>

        <!-- 待审核 -->
        <section id="pending-tab" class="tab-content hidden">
          <div id="pending-list" class="pending-list">
            <p class="empty">暂无待审核申请</p>
          </div>
        </section>

        <!-- 管理员 -->
        <section id="admins-tab" class="tab-content hidden">
          <h3>管理员列表</h3>
          <div id="admin-list" class="admin-list"></div>
          <div class="add-form super-only">
            <input type="text" id="new-admin" placeholder="输入QQ号添加管理员...">
            <button class="btn" id="add-admin-btn">添加</button>
          </div>
        </section>
      </main>

      <footer>
        <p>数据存储于 <a href="https://gist.github.com/MOYIre/a9f8a81d1ec3498c0d7b7afc24f43794" target="_blank">GitHub Gist</a></p>
      </footer>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
