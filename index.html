<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食灵管理面板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 登录前 -->
    <div id="login-screen" class="screen">
      <div class="container">
        <h1>食灵管理面板</h1>
        <p class="subtitle">云菜单管理系统</p>
        
        <!-- 登录方式选择 -->
        <div class="login-options">
          <div class="login-option">
            <h3>超级管理员</h3>
            <p class="desc">使用 GitHub Token 登录</p>
            <button id="super-login-btn" class="btn primary">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
              GitHub 登录
            </button>
          </div>
          
          <div class="login-divider">
            <span>或</span>
          </div>
          
          <div class="login-option">
            <h3>管理员</h3>
            <p class="desc">向骰子发送 <code>.食灵 登录</code> 获取Token</p>
            <div class="token-form">
              <input type="text" id="token-input" placeholder="输入登录Token...">
              <button class="btn" id="token-login-btn">登录</button>
            </div>
          </div>
        </div>
        
        <p class="hint">管理员可通过骰子私聊获取登录Token</p>
      </div>
    </div>

    <!-- 主界面 -->
    <div id="main-screen" class="screen hidden">
      <header>
        <h1>食灵管理面板</h1>
        <div class="user-info">
          <img id="avatar" src="" alt="avatar">
          <span id="username"></span>
          <span id="role-badge" class="badge"></span>
          <button id="logout-btn" class="btn small">退出</button>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="menu">菜单管理</button>
        <button class="tab" data-tab="drink">饮品单</button>
        <button class="tab" data-tab="pending">待审核 <span id="pending-count" class="count hidden">0</span></button>
        <button class="tab admin-only hidden" data-tab="admins">管理员</button>
      </nav>

      <main>
        <!-- 菜单管理 -->
        <section id="menu-tab" class="tab-content active">
          <div class="period-tabs">
            <button class="period-tab active" data-period="breakfast">早餐</button>
            <button class="period-tab" data-period="lunch">午餐</button>
            <button class="period-tab" data-period="dinner">晚餐</button>
            <button class="period-tab" data-period="midnight">夜宵</button>
            <button class="period-tab" data-period="extra">通用池</button>
          </div>
          <div class="menu-list" id="food-list"></div>
          <div class="add-form">
            <input type="text" id="new-food" placeholder="添加新菜品...">
            <button class="btn" id="add-food-btn">添加</button>
          </div>
        </section>

        <!-- 饮品单 -->
        <section id="drink-tab" class="tab-content hidden">
          <div class="menu-list" id="drink-list"></div>
          <div class="add-form">
            <input type="text" id="new-drink" placeholder="添加新饮品...">
            <button class="btn" id="add-drink-btn">添加</button>
          </div>
        </section>

        <!-- 待审核 -->
        <section id="pending-tab" class="tab-content hidden">
          <div id="pending-list" class="pending-list">
            <p class="empty">暂无待审核申请</p>
          </div>
        </section>

        <!-- 管理员 -->
        <section id="admins-tab" class="tab-content hidden">
          <div class="admin-info">
            <p><strong>超级管理员：</strong>Gist 创建者（自动授权）</p>
          </div>
          <h3>管理员列表</h3>
          <div id="admin-list" class="admin-list"></div>
          <div class="add-form super-only">
            <input type="text" id="new-admin" placeholder="输入QQ号添加管理员...">
            <button class="btn" id="add-admin-btn">添加</button>
          </div>
        </section>
      </main>

      <footer>
        <p>数据存储于 <a href="https://gist.github.com/MOYIre/a9f8a81d1ec3498c0d7b7afc24f43794" target="_blank">GitHub Gist</a></p>
      </footer>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
